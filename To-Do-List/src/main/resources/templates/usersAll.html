<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Список пользователей</h1>
<h3 th:if="${successMessage}" th:text="${successMessage}" style="color : green;"></h3>
<form method="get" action="/users/all">
    <div class="input-group">
        <input type="search"
               name="search"
               placeholder="Поиск по имени"
               th:value="${search}">
        <button type="submit" class="btn btn-primary">Искать</button>
    </div>
</form>
<div th:if="${#lists.isEmpty(allUsers)}">
    <p class="text-muted">Пользователи отсусвтуют</p>
</div>
<div th:unless="${#lists.isEmpty(allUsers)}">
    <div th:each="us : ${allUsers}">
        <p>
            <a th:href="@{/users/{id}(id=${us.id})}" th:text="${us.id}"></a>
        </p>
        <p th:text="${us.username}"></p>
        <p th:text="${us.email}"></p>
        <p th:text="${us.surname}"></p>
        <p th:text="${us.dateOfBirthday}"></p>

    </div>
</div>

<nav th:if="${totalPages != null && totalPages > 1}">
    <ul>
        <li th:if="${currentPage > 0}">
            <a th:href="@{/users/all(page=${currentPage - 1},size=10)}"> Назад</a>
        </li>
        <li th:each="i : ${#numbers.sequence(0,totalPages-1)}">
            <a th:href="@{/users/all(page=${i}, size = 10)}"
               th:text="${i+1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
        </li>
        <li th:if="${currentPage < totalPages - 1}">
            <a th:href="@{/users/all(page=${currentPage + 1}, size=10)}">Вперёд »</a>
        </li>
    </ul>
</nav>

<br>
<a href="/home">Выйти</a>
<br>
<a th:href="@{/users/new}" sec:authorize="hasRole('ADMIN')">Добавить нового пользователя</a>
<br>
<a th:href="@{/tasks/all}" sec:authorize="hasRole('ADMIN')">На страницу задач</a>
</body>
</html>
