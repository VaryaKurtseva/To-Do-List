<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обновление статуса задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form th:action="@{/tasks/{id}/setStatus(id=${task.id})}"
      th:method="post">
    <div>
        <label for="newStatus">Введите новый статус задачи</label>
        <input type="text" id = "newStatus" name="newStatus" required>
    </div>
    <button type="submit">Установить новый статус</button>

</form>
<br>
<a th:href="@{/tasks/{id}(id=${task.id})}">Вернуться обратно</a>

</body>
</html>
