<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Новая задача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Создание новой задачи</h1>
<form th:action="@{/tasks/new/{userId}(userId=${userId})}"
      th:method="post"
      th:object="${TaskDTO}">

    <div>
        <label for="nameTask" class="form-label">Название задачи *</label>
        <input type="text"
               id="nameTask"
               th:field="*{nameTask}"
               placeholder="Введите название задачи"
               th:errorclass="invalid"
               required>
        <div th:if="${#fields.hasErrors('nameTask')}" >
            <span th:errors="*{nameTask}"></span>
        </div>
    </div>
    <div>
        <label for="textOfTask" class="form-label">Описание задачи *</label>
        <input type="text"
               id="textOfTask"
               th:field="*{textOfTask}"
               placeholder="Введите текст задачи"
               th:errorclass="invalid"
               required>
        <div th:if="${#fields.hasErrors('textOfTask')}" >
            <span th:errors="*{textOfTask}"></span>
        </div>
    </div>
    <div>
        <label for="deadline" class="form-label">Дедлайн</label>
        <input type="date"
               id="deadline"
               placeholder="Введите дедлайн задачи"
               th:field="*{deadline}"
               th:errorclass="invalid"
               required
        >
        <div th:if="${#fields.hasErrors('deadline')}" >
            <span th:errors="*{deadline}"></span>
        </div>
    </div>
    <div>
        <label for="additionalInfo" class="form-label">Дополнительная информация</label>
        <input type="text"
               id="additionalInfo"
               th:field="*{additionalInfo}"
               placeholder="Любая дополнительная информация">
    </div>
    <div >
        <label for="status" class="form-label">Статус</label>
        <select id="status"
                th:field="*{status}"
                >
            <option value="">Выберите статус</option>
            <option value="Hard">Сложная</option>
            <option value="Easy">Легкая</option>
            <option value="Avarage">Средняя</option>
        </select>
    </div>

    <div class="mb-3">
        <button type="submit" class="btn btn-success">Создать задачу</button>
        <a th:href="@{/users/{id}(id=${userId})}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
<br>
<a th:href="@{/users/{id}(id=${userId})}" class="btn btn-outline-primary">Назад к пользователю</a>
<a th:href=@"{/users/all}" class="btn btn-outline-secondary" sec:authorize="hasRole('ADMIN')">К списку пользователей</a>
</body>
</html>
