<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h3 class="text-center">Вход в систему</h3>
<!-- Отображение ошибок аутентификации -->
<div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Ошибка!</strong> Неверное имя пользователя или пароль.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Успех!</strong> Вы успешно вышли из системы.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<form th:action="@{/login}"
      method="post">
    <div>
        <label for="username" class="form-label">Имя пользователя *</label>
        <input type="text"
               class="form-control"
               id="username"
               name="username"
               th:value="${username != null} ? ${username} : ''"
               placeholder="Введите ваше имя пользователя"
               required>

    </div>

    <div>
        <label for="password" class="form-label">Пароль *</label>
        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="Введите ваш пароль"
               required
               >

    </div>

    <div class="text-center">

        <button type="submit">Войти в систему</button>

    </div>
</form>

<div class="text-center">
    <p>Нет аккаунта? <a th:href="@{/register}" class="text-decoration-none">Зарегистрируйтесь</a></p>
    <p><a th:href="@{/home}" class="text-decoration-none">← Выйти</a></p>
</div>
</body>
</html>
