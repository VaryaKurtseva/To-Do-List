<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Расписание задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1><b>Расписание выполнения задач</b></h1>
<h3>Количество задач в расписании: <span th:text="${tasks != null ? tasks.size() : 0}"></span></h3>
<div th:if="${#maps.isEmpty(tasks)}">
    <p class="text-muted">Задачи отсусвтуют</p>
</div>
<div th:unless="${#maps.isEmpty(tasks)}">
    <div th:each="entry : ${tasks}">
        <b><span th:text="${entry.key}"></span></b>
        <div th:each="ts : ${entry.value}">
            <p>
                <a th:href="@{/tasks/{id}(id=${ts.id})}" th:text="${ts.id}"></a>
            </p>
            <p th:text="${ts.deadline}"></p>
            <p th:text="${ts.nameTask}"></p>
            <p th:text="${ts.textOfTask}"></p>
            <p th:text="${ts.additionalInfo}"></p>
            <p th:text="${ts.status}"></p>
        </div>

    </div>
</div>

</body>
</html>
