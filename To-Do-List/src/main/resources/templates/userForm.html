<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Новый пользователь</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Новый пользователь</h1>
<form th:action ="@{/users}"
      th:method="post"
      th:object="${userDTO}"
>
    <div>
        <label for="username">
            Имя
        <input id="username"
               th:field="*{username}"
               type ="text"
               placeholder="Введите имя пользователя"
               th:errorclass="invalid">
            <small th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}"
                   style="color: red;"></small>
        </label>
    </div>
    <div>
        <label for="email">
            Email
            <input id="email"
                   th:field="*{email}"
                   type ="email"
                   placeholder="Введите email"
                   th:errorclass="invalid">
            <small th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"
                   style="color: red;"></small>
        </label>
    </div>

    <div>
        <label for="surname">
            Фамилия
            <input id="surname"
                   th:field="*{surname}"
                   type ="text"
                   placeholder="Введите фамилию пользователя"
                   th:errorclass="invalid">
            <small th:if="${#fields.hasErrors('surname')}"
                   th:errors="*{surname}"
                   style="color: red;"></small>
        </label>

    </div>
    <div>
        <label for="dateOfBirthday">
            Дата рождения
            <input id="dateOfBirthday"
                   th:field="*{dateOfBirthday}"
                   type ="date"
                   placeholder="Введите дату рождения пользователя"
                   th:errorclass="invalid">
            <small th:if="${#fields.hasErrors('dateOfBirthday')}"
                   th:errors="*{dateOfBirthday}"
                   style="color: red;"></small>
        </label>

    </div>

    <button type="submit">Добавить нового пользователя</button>
</form>
<br>
<a th:href="@{/users/all}" sec:authorize="hasRole('ADMIN')">Назад к списку</a>
<br>
<a href="/home">Выйти</a>
</body>
</html>
