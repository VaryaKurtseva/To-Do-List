<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список задач пользователя</title>
    <title th:text="${user != null ? user.username : 'Пользователь не найден'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<h1>Список задач пользователя</h1>
<body>
<div th:if="${#lists.isEmpty(tasks)}">
    <p>У пользователя отсуствуют задачи</p>
</div>
<div th:unless="${#lists.isEmpty(tasks)}">
    <div th:each="task : ${tasks}">
        <p>
            <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.id}"></a>
        </p>
        <p>Имя задачи <span th:text="${task.nameTask}"></span></p>
        <p>Текст задачи <span th:text="${task.textOfTask}"></span></p>
        <p>Дедлайн задачи <span th:text="${task.deadline}"></span></p>
        <p>Статус задачи <span th:text="${task.status}"></span></p>
    </div>
</div>
<br>
<a th:href="@{/tasks/new/{userId}(userId=${user.id})}">Создать новую задачу</a>
<br>
<a th:href="@{/tasks/schedule}">Получить расписание выполнения задач</a>
<br>
<a th:href="@{/users/{Id}(Id=${user.id})}">Вернуться на страницу пользователя</a>
<br>
<a th:href="@{/home}">Выйти</a>
</body>
</html>
