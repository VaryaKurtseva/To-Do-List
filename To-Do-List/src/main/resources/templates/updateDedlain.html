<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обновление дедлайна задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form th:action="@{/tasks/{id}/updateDedlain(id=${task.id})}"
      th:method="post">
    <p>Имя задачи </p> <span th:text="${task.nameTask}"></span>
    <p>Текущий дедлайн</p> <span th:text="${task.deadline}"></span>
    <div>
        <label for="newDate">Введите новый дедлайн задачи</label>
        <input type="date" id = "newDate" name="newDate" required>
    </div>
    <button type="submit">Установить новый дедлайн</button>

</form>
<br>
<a th:href="@{/tasks/{id}(id=${task.id})}">Вернуться обратно</a>
</body>
</html>
