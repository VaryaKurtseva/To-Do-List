<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${user != null ? user.username : 'Пользователь не найден'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:if="${user}">
    <h1 th:text="${user.username}">Имя пользователя</h1>
    <p><b>Email: </b><span th:text="${user.email}"></span></p>
    <p><b>Фамилия: </b><span th:text="${user.surname}"></span></p>
    <p><b>Дата рождения: </b><span th:text="${user.dateOfBirthday}"></span></p>
    <p><b>Продуктивность: </b><span th:text="${user.productivity}"></span></p>
    <a th:href="@{/tasks/new/{userId}(userId=${user.id})}">Создать задачу</a>

</div>
<div th:unless="${user}">
    <h1>Пользователи отсуствуют</h1>
    <p> Пользователь с указанным ID отсуствует</p>
</div>
<br>
<a th:href="@{/users/{id}/userDelete(id=${user.id})}" sec:authorize="hasRole('ADMIN')">
    <button type="submit">Удалить пользователя</button> </a>
<br>
<a th:href="@{/users/{id}/userTasks(id=${user.id})}" >
    <button type="submit">Задачи пользователя</button> </a>

<br>
<a th:href="@{/users/all}" sec:authorize="hasRole('ADMIN')">Назад к списку пользователей</a>
<br>
<a th:href="@{/home}">Выйти</a>

</body>
</html>
